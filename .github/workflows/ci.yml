name: Validate project

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Bundle budget
        run: npm run check:budget

      - name: Verify static export
        run: |
          test -f dist/client/index.html
          test -f dist/client/search.html
          test -f dist/client/audiobooks.html
          test -f dist/client/films.html
          test -f dist/client/characters.html
          test -f dist/client/timeline.html
          test -f dist/client/universe.html
          test -f dist/client/shop.html
          test -f dist/client/account.html
          test -f dist/client/admin.html
          test -f dist/client/community.html
          test -f dist/client/stories/tihiy-den.html
          test -f dist/client/sitemap.xml
          test -f dist/client/robots.txt
          test -f docs/CMS_CONTRACT.md
          test -f dist/client/favicon.svg
          test -f dist/client/og.png
          test -d dist/client/_next/static/css
          test -d dist/client/_next/static/chunks
          find dist/client/_next/static/css -type f | grep -q .
          find dist/client/_next/static/chunks -type f | grep -q .
          test ! -d dist/client/ozon671games/_next
          grep -q '/ozon671games/_next/static/css/' dist/client/index.html
          grep -q '/ozon671games/_next/static/chunks/' dist/client/index.html
          grep -q '/ozon671games/search.html' dist/client/index.html
          grep -q '/ozon671games/audiobooks.html' dist/client/index.html
          grep -q '/ozon671games/films.html' dist/client/index.html
          grep -q '/ozon671games/characters.html' dist/client/index.html
          grep -q '/ozon671games/timeline.html' dist/client/index.html
          grep -q '/ozon671games/universe.html' dist/client/index.html
          grep -q '/ozon671games/shop.html' dist/client/index.html
          grep -q '/ozon671games/community.html' dist/client/index.html
          grep -q '/ozon671games/account.html' dist/client/index.html
          grep -q '/ozon671games/stories/tihiy-den.html' dist/client/index.html
          grep -q 'https://benzilya.github.io/ozon671games/' dist/client/sitemap.xml
          grep -q '/ozon671games/admin.html' dist/client/robots.txt
          grep -q '/ozon671games/account.html' dist/client/robots.txt
          grep -q 'application/ld+json' app/stories/tihiy-den/page.tsx
          grep -q 'Book' app/stories/tihiy-den/page.tsx
          grep -q 'application/ld+json' app/shop/page.tsx
          grep -q 'Product' app/shop/page.tsx
          grep -q 'application/ld+json' app/films/page.tsx
          grep -q 'VideoObject' app/films/page.tsx
          grep -q 'Перейти к основному содержанию' dist/client/index.html
          grep -q 'id="main-content"' dist/client/index.html
          grep -q ':focus-visible' app/accessibility.css
          grep -q 'prefers-reduced-motion' app/accessibility.css
          grep -q 'min-height: 44px' app/accessibility.css
          grep -q 'content-visibility: auto' app/performance.css
          grep -q 'prefers-reduced-data' app/performance.css
          grep -q 'ozon671:catalog-filters' app/audiobooks/AudiobooksClient.tsx
          grep -q 'aria-live="polite"' app/search/SearchClient.tsx
          grep -q 'URLSearchParams' app/search/SearchClient.tsx
          echo "Static export, global search, filters, SEO, accessibility, performance and routed navigation contracts are valid."
