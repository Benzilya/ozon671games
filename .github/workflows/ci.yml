name: Validate project

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Verify static export
        run: |
          echo "Exported files:"
          find dist/client -maxdepth 3 -type f | sort | head -100
          find dist/client -name index.html -type f | grep -q .
          find dist/client -name favicon.svg -type f | grep -q .
          find dist/client -name og.png -type f | grep -q .
          echo "Static export files are present."
