name: Deploy Cloudflare backend

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
      CF_D1_DATABASE_ID: ${{ vars.CF_D1_DATABASE_ID }}
      CF_D1_DATABASE_NAME: ${{ vars.CF_D1_DATABASE_NAME }}
      CF_R2_BUCKET_NAME: ${{ vars.CF_R2_BUCKET_NAME }}
      CF_WORKER_NAME: ${{ vars.CF_WORKER_NAME }}
      CF_API_BASE_URL: ${{ vars.CF_API_BASE_URL }}
      OIDC_ISSUER: ${{ vars.OIDC_ISSUER }}
      OIDC_AUDIENCE: ${{ vars.OIDC_AUDIENCE }}
      OIDC_JWKS_URL: ${{ vars.OIDC_JWKS_URL }}
      USER_ALLOWED_ORIGIN: ${{ vars.USER_ALLOWED_ORIGIN }}
      ADMIN_ALLOWED_ORIGIN: ${{ vars.ADMIN_ALLOWED_ORIGIN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate production environment contract
        run: node scripts/validate-cloudflare-production-env.mjs

      - name: Generate production Wrangler config
        run: node scripts/write-cloudflare-production-config.mjs

      - name: Build Worker and static assets
        env:
          CLOUDFLARE_VITE_WRANGLER_CONFIG_PATH: wrangler.production.json
        run: npm run build

      - name: Dry-run Worker deployment
        env:
          CLOUDFLARE_VITE_WRANGLER_CONFIG_PATH: wrangler.production.json
        run: npx wrangler deploy --dry-run --outdir .wrangler/dry-run

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote --config wrangler.production.json

      - name: Deploy Worker
        env:
          CLOUDFLARE_VITE_WRANGLER_CONFIG_PATH: wrangler.production.json
        run: npx wrangler deploy

      - name: Set admin API secret
        shell: bash
        run: printf '%s' "$ADMIN_API_TOKEN" | npx wrangler secret put ADMIN_API_TOKEN --name "$CF_WORKER_NAME"

      - name: Smoke check production backend
        run: node scripts/smoke-cloudflare-production.mjs
